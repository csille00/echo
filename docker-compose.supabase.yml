# Run journal-search API alongside an existing self-hosted Supabase stack.
# No Ollama required — use EMBEDDING_PROVIDER=google in .env.
#
# Usage (on the Supabase host):
#   cp .env.production.example .env
#   # fill in secrets, then:
#   docker compose -f docker-compose.supabase.yml up -d --build
#
# Requires the Supabase compose project `supabase-journal-search` to already be running.

services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-/dev/null}:/secrets/vision.json:ro
    environment:
      DBOS_CONDUCTOR_URL: ${DBOS_CONDUCTOR_URL:-ws://dbos-conductor:8090/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - supabase
      - dbos
      - default
    restart: unless-stopped

networks:
  supabase:
    external: true
    name: supabase-journal-search_default
  dbos:
    external: true
    name: dbos-network
