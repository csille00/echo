# DBOS Configuration
# https://docs.dbos.dev/python/reference/configuration

database:
  # Uses DATABASE_URL from environment
  hostname: ${DBOS_DATABASE_HOST:-localhost}
  port: ${DBOS_DATABASE_PORT:-5432}
  username: ${DBOS_DATABASE_USER:-postgres}
  password: ${DBOS_DATABASE_PASSWORD}
  app_db_name: ${DBOS_DATABASE_NAME:-journal_search}

runtimeConfig:
  start:
    - "journal_search.workflows"
