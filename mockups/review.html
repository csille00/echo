<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Review — Journal mockup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">Journal</div>
        <a class="nav-item" href="calendar.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Calendar
        </a>
        <a class="nav-item" href="browse.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Browse
        </a>
        <a class="nav-item" href="ask.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2 8.5 8.5 0 0 1-7.4 4.3 8.4 8.4 0 0 1-4.2-1.1L3 21l1.1-5.3"/></svg>
          Ask
        </a>
        <div class="sidebar-footer">
          <button type="button" class="theme-toggle" data-theme-toggle>Dark appearance</button>
        </div>
      </aside>

      <div class="main">
        <header class="toolbar">
          <a class="btn btn-ghost" href="calendar.html">Cancel</a>
          <span class="title-3">Review</span>
          <a class="btn btn-primary" href="entry.html">Save</a>
        </header>

        <div class="content">
          <div class="scan-preview">Scanned page preview</div>

          <div class="group">
            <div class="inset">
              <div class="row">
                <div class="row-body">
                  <p class="row-title">Date</p>
                </div>
                <span class="footnote">Oct 22, 2026</span>
                <span class="row-chevron">›</span>
              </div>
              <div class="row">
                <div class="row-body">
                  <p class="row-title">Title</p>
                </div>
                <span class="footnote">Optional</span>
                <span class="row-chevron">›</span>
              </div>
            </div>
          </div>

          <div class="group">
            <p class="group-label">Recognized text</p>
            <textarea class="text-editor" aria-label="Edit recognized text">Today we walked along the creek and talked about planting tomatoes in the side bed. The kids found a salamander under the stepping stone.

I want to remember to call Mom this weekend.</textarea>
            <p class="caption" style="margin-top:8px">Fix OCR errors before saving. You can edit again later from the entry.</p>
          </div>

          <a class="btn btn-ghost" href="review.html" style="margin-top:8px">Save and scan another page</a>
        </div>
      </div>
    </div>

    <nav class="tab-bar">
      <a class="tab-item" href="calendar.html">Calendar</a>
      <a class="tab-item" href="browse.html">Browse</a>
      <a class="tab-item" href="ask.html">Ask</a>
    </nav>
    <script src="shared.js"></script>
  </body>
</html>
