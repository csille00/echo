[project]
name = "journal-search"
version = "0.1.0"
description = "AI-powered journal search and OCR processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbos[enterprise]>=0.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "supabase>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.380",
    "ruff>=0.6.0",
]
ocr-tesseract = [
    "pytesseract>=0.3.13",
]
ocr-surya = [
    "surya-ocr>=0.6.0",
]
ocr-google-vision = [
    "google-auth>=2.0.0",
    "requests>=2.32.0",
]
embeddings-ollama = [
    "ollama>=0.3.0",
]
embeddings-google = [
    "google-auth>=2.0.0",
]
llm-cleanup = [
    "ai[openai]>=0.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI uses File(...)/Form(...) in parameter defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["ASYNC"]  # CLI scripts use sync pathlib I/O before await
"**/prompt.py" = ["E501"]  # prompt strings are intentionally long

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
